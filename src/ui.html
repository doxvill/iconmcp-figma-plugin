<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IconMCP</title>
    <!--INLINE_CSS-->
  </head>
  <body>
    <div id="app" class="app">
      <header class="header">
        <div class="search-row">
          <div class="search-box">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="7" cy="7" r="4.5" />
              <path d="M10.5 10.5L13.5 13.5" />
            </svg>
            <input
              id="search-input"
              class="search-input"
              type="text"
              placeholder="Search icons by meaning..."
              autocomplete="off"
              spellcheck="false"
            />
            <button id="clear-search" class="clear-btn" type="button" title="Clear search" hidden>&times;</button>
          </div>
          <select id="set-select" class="set-select" title="Filter by theme / set">
            <option value="">Loading sets...</option>
          </select>
        </div>

        <div id="category-bar" class="category-bar" hidden></div>

        <div class="meta-row">
          <span id="status-text" class="status-text">Loading...</span>
          <span id="hover-name" class="hover-name">Click to insert &middot; Right-click to copy</span>
        </div>
      </header>

      <main id="grid-scroll" class="grid-scroll">
        <div id="request-banner" class="request-banner" hidden>
          <span id="request-banner-text">Not what you need?</span>
          <button id="request-banner-btn" class="banner-btn" type="button">Request icon</button>
        </div>
        <div id="icon-grid" class="icon-grid"></div>
        <div id="empty-state" class="empty-state" hidden>
          <p id="empty-title" class="empty-title">No icons found</p>
          <p id="empty-subtitle" class="empty-subtitle">Try different words or switch the set.</p>
          <button id="empty-request-btn" class="load-more-btn empty-action" type="button" hidden>
            Request this icon from IconMCP
          </button>
          <button id="empty-retry-btn" class="load-more-btn empty-action" type="button" hidden>
            Retry
          </button>
        </div>
        <div id="load-more-wrap" class="load-more-wrap" hidden>
          <button id="load-more-btn" class="load-more-btn" type="button">Load more</button>
        </div>
      </main>

      <footer class="footer">
        <div class="controls-row">
          <div class="segmented" role="group" aria-label="Icon style">
            <button type="button" class="seg-btn active" data-style="outline">Outline</button>
            <button type="button" class="seg-btn" data-style="duotone">Duotone</button>
          </div>

          <label class="compact-field" title="Inserted size in px">
            <span>Size</span>
            <select id="size-select" class="mini-select">
              <option value="16">16px</option>
              <option value="20">20px</option>
              <option value="24" selected>24px</option>
              <option value="32">32px</option>
              <option value="48">48px</option>
            </select>
          </label>

          <label class="color-field" title="Icon color">
            <input id="color-picker" type="color" value="#111111" class="color-swatch" />
            <input id="color-hex" type="text" value="#111111" maxlength="7" class="color-hex" spellcheck="false" />
          </label>
        </div>

        <div class="sliders-row">
          <label class="slider-field">
            <span class="slider-label">Stroke <strong id="stroke-val">1.25</strong></span>
            <input id="stroke-range" type="range" min="0.75" max="2.5" step="0.25" value="1.25" />
          </label>

          <label class="slider-field">
            <span class="slider-label">Radius <strong id="radius-val">2</strong></span>
            <input id="radius-range" type="range" min="0" max="4" step="0.5" value="2" />
          </label>
        </div>

        <div class="mode-row">
          <button id="toggle-component" class="mode-pill" type="button" title="Insert icons as Figma Components">
            <span class="mode-dot"></span>
            As Component
          </button>
          <button id="toggle-replace" class="mode-pill" type="button" title="Replace currently selected node on canvas">
            <span class="mode-dot"></span>
            Replace selected
          </button>
          <button id="open-request-btn" class="mode-pill mode-pill-right" type="button" title="Ask IconMCP agents to draw a new icon">
            + Request
          </button>
        </div>

        <div id="resize-handle" class="resize-handle" title="Drag to resize"></div>
      </footer>
    </div>

    <div id="context-menu" class="context-menu" hidden>
      <button type="button" class="ctx-item" data-action="insert">Insert into Figma</button>
      <button type="button" class="ctx-item" data-action="copy-svg">Copy SVG</button>
      <button type="button" class="ctx-item" data-action="copy-jsx">Copy React (JSX)</button>
      <div class="ctx-sep"></div>
      <button type="button" class="ctx-item ctx-danger" data-action="report">Report issue...</button>
    </div>

    <div id="request-modal" class="modal-backdrop" hidden>
      <form id="request-form" class="modal-card">
        <div class="modal-head">
          <strong>Request new icon</strong>
          <button type="button" class="modal-close" data-close="request-modal">&times;</button>
        </div>
        <label class="modal-field">
          <span>Icon name (max 60 chars)</span>
          <input id="req-name" type="text" maxlength="60" required placeholder="e.g. ice cream scoop" />
        </label>
        <label class="modal-field">
          <span>What is it for? (optional, max 140 chars)</span>
          <input id="req-why" type="text" maxlength="140" placeholder="e.g. a dessert menu" />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-sec" data-close="request-modal">Cancel</button>
          <button id="req-submit" type="submit" class="btn-primary">Send request</button>
        </div>
      </form>
    </div>

    <div id="report-modal" class="modal-backdrop" hidden>
      <form id="report-form" class="modal-card">
        <div class="modal-head">
          <strong>Report icon issue</strong>
          <button type="button" class="modal-close" data-close="report-modal">&times;</button>
        </div>
        <div class="modal-badge">Icon: <code id="rep-icon-name"></code></div>
        <label class="modal-field">
          <span>Reason</span>
          <select id="rep-reason">
            <option value="meaning">Doesn't match meaning</option>
            <option value="broken">Broken / rendering glitch</option>
            <option value="name">Wrong or confusing name</option>
            <option value="style">Off-style for library</option>
            <option value="similar">Duplicate / too similar</option>
            <option value="inappropriate">Inappropriate</option>
            <option value="other">Other</option>
          </select>
        </label>
        <label id="rep-note-wrap" class="modal-field" hidden>
          <span>Details (max 140 chars)</span>
          <input id="rep-note" type="text" maxlength="140" placeholder="Describe what is wrong" />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn-sec" data-close="report-modal">Cancel</button>
          <button id="rep-submit" type="submit" class="btn-primary">Submit report</button>
        </div>
      </form>
    </div>
    <!--INLINE_JS-->
  </body>
</html>
